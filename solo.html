<body>
<main id="app" class="solo" aria-live="polite"></main>
<!-- Pantalla de carga: contador 0→100 (motion «Loader Counter»). Llega a 100 cuando aparece la primera pantalla. -->
<div id="boot" class="boot" role="progressbar" aria-label="Cargando AuxiliOS Solo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="boot-brand">AUXILI<b>OS</b> <span>SOLO</span></div>
  <div class="boot-foot"><div class="boot-num"><span id="boot-n">0</span><i>%</i></div><p class="boot-msg">Preparando tu grúa…</p>
    <div class="boot-bar"><span id="boot-bar"></span></div></div>
</div>
<script>
(function(){
  var el=document.getElementById('boot'),n=document.getElementById('boot-n'),bar=document.getElementById('boot-bar'),app=document.getElementById('app');
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),v=0,done=false,raf;
  function paint(x){v=x;var k=Math.round(x);n.textContent=k;bar.style.transform='scaleX('+(x/100)+')';el.setAttribute('aria-valuenow',k);}
  // Mientras carga se acerca a 90 cada vez más despacio; nunca llega solo a 100.
  function tick(now){if(done)return;paint(90*(1-Math.exp(-(now-t0)/900)));raf=requestAnimationFrame(tick);}
  function finish(){if(done)return;done=true;cancelAnimationFrame(raf);
    var from=v,s=performance.now(),dur=reduced?0:260;
    (function up(now){var p=dur?Math.min(1,(now-s)/dur):1;paint(from+(100-from)*(1-Math.pow(1-p,3)));
      if(p<1)return requestAnimationFrame(up);el.classList.add('done');setTimeout(function(){el.remove();},reduced?0:420);})(s);}
  if(reduced){paint(0);n.parentNode.parentNode.classList.add('still');}else raf=requestAnimationFrame(tick);
  new MutationObserver(function(m,o){if(app.firstElementChild){o.disconnect();finish();}}).observe(app,{childList:true});
  setTimeout(finish,15000);
})();
</script>
<div id="toast" class="solo-toast" role="status" hidden></div>
</body>
