<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap">
<style>*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;background:#07080b;color:#eef0f4;font-family:'DM Sans';overflow:hidden;position:relative}
#rain{position:absolute;inset:-200px;background:repeating-linear-gradient(105deg,transparent 0 46px,rgba(170,190,220,.10) 46px 48px);opacity:.9}
#bz{position:absolute;inset:0;background:radial-gradient(45% 30% at 50% 82%,rgba(245,166,35,.40),transparent 70%)}
#road{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(transparent,rgba(20,22,28,.9))}
.l{position:absolute;left:80px;right:80px;top:760px;font:400 190px/.9 'Bebas Neue';letter-spacing:.01em;opacity:0;text-align:left}
.am{color:#f5a623}.rd{color:#ef6b6b}
.brand{font:400 96px/1 'Bebas Neue';letter-spacing:.04em}.brand b{color:#f5a623;font-weight:400}.brand span{font-size:42px;letter-spacing:.22em;color:#8a90a0;margin-left:12px}
.cta{display:inline-flex;align-items:center;gap:18px;background:#f5a623;color:#111;font:700 58px 'DM Sans';padding:36px 64px;border-radius:32px}
</style></head><body><div id="rain"></div><div id="bz"></div><div id="road"></div>
<div class="l" id="a">3:00 AM.</div>
<div class="l" id="b">Banquina.<br><span class="am">Lluvia.</span></div>
<div class="l" id="c">Servicio<br>terminado.</div>
<div class="l" id="d">¿Y el<br><span class="am">remito?</span></div>
<div class="l" id="e">En la guantera.<br><span class="rd">Mojado.</span></div>
<div class="l" id="f">Sin remito,<br><span class="rd">no se cobra.</span></div>
<div class="l" id="g">Hay otra<br><span class="am">forma.</span></div>
<div id="end" style="position:absolute;left:80px;right:80px;top:560px;text-align:center;opacity:0"><div class="brand">AUXILI<b>OS</b><span>SOLO</span></div>
 <div style="font:400 140px/.92 'Bebas Neue';margin:60px 0 40px">Remito con fotos y firma, <span class="am">en el celular.</span></div>
 <div style="font-size:46px;color:#b9beca;margin-bottom:70px">Y se lo mandás al socio por WhatsApp.</div><span class="cta" id="cta">Probala gratis →</span>
 <div style="font-size:38px;color:#8a90a0;margin-top:40px">Gratis en la etapa de prueba · sin tarjeta</div></div>
<script>
const $=id=>document.getElementById(id),cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a))),ease=t=>1-Math.pow(1-t,3);
const B=[['a',0,1.3],['b',1.3,2.7],['c',2.7,4.0],['d',4.0,5.4],['e',5.4,7.0],['f',7.0,8.6],['g',8.6,9.9]];
window.render=t=>{$('rain').style.transform=`translate(${(t*260)%49}px,${(t*900)%900}px)`;
 const blink=(Math.sin(t*Math.PI*2/0.8)+1)/2;$('bz').style.opacity=t<9.9?.25+.75*blink:.25;
 B.forEach(([id,a,b])=>{const i=ease(cl(t,a,a+.18)),o=1-cl(t,b-.12,b);const el=$(id);el.style.opacity=Math.min(i,o);el.style.transform=`scale(${1.12-.12*i})`;});
 const k=ease(cl(t,9.9,10.3));$('end').style.opacity=k;$('end').style.transform=`translateY(${(1-k)*40}px)`;$('cta').style.transform=`scale(${1+.04*Math.sin(Math.max(0,t-10.5)*5)})`;};
render(0);</script></body></html>
