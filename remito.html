<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tu remito</title>
<link rel="icon" href="/assets/logo-auxilios-main.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1e22;--muted:#6e727a;--line:#e3e5e9;--brand:#f5a623;--brand-ink:#111;--red:#c8342e;--ok:#1f7a4d;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--text:#e6e8eb;--muted:#8b929c;--line:#2a313b;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
header.brand{padding:6px 2px 16px}
header.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.1px}
header.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.srv{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.srv h2{margin:0;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.state{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.state.is-ok{color:var(--ok)}.state.is-ok::before{background:var(--ok)}
.state.is-void{color:var(--red)}.state.is-void::before{background:var(--red)}
.state.is-pending{color:#b26b00}.state.is-pending::before{background:var(--brand)}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0 0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:800;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.secondary{border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
.survey h3{margin:0 0 2px;font-size:18px}
.survey>p{margin:0 0 14px;color:var(--muted);font-size:14px}
.q{margin:0 0 16px;padding:0;border:0}
.q legend{margin-bottom:8px;padding:0;font-size:14px;font-weight:700}
.q legend small{color:var(--muted);font-weight:500}
.stars{display:flex;gap:6px}
.stars button{flex:1;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--line);font-size:26px;line-height:1;cursor:pointer;transition:color .12s,border-color .12s}
.stars button.on{color:var(--brand);border-color:var(--brand)}
.stars-hint{min-height:18px;margin-top:4px;color:var(--muted);font-size:12px}
.yesno{display:flex;gap:8px}
.yesno button{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.yesno button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--card))}
textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.err{margin:0 0 12px;color:var(--red);font-size:13px;font-weight:600}
.err[hidden]{display:none}
.thanks{text-align:center;padding:26px 16px}
.thanks .big{font-size:40px;line-height:1}
.thanks h3{margin:10px 0 4px;font-size:19px}
.thanks p{margin:0;color:var(--muted)}
.center{padding:48px 16px;text-align:center;color:var(--muted)}
footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<main id="app"><div class="center">Cargando tu remito…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
<script src="/remito-pdf-v2.js" defer></script>
<script>
/* Página pública del remito (sin login): resumen, PDF y encuesta de calidad.
   Todo pasa por get_public_remito_v1 / submit_remito_survey_v1 con el token
   del link (/r/<token>). */
(()=>{'use strict';
const SUPABASE_URL='https://bcjcrlrrqfbipleiwkqi.supabase.co';
const SUPABASE_KEY='sb_publishable_daGVg7URncTvLzC7N8NzOA_Z0CWB-1M';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fecha=iso=>{if(!iso)return'—';const d=new Date(iso);return isNaN(d)?'—':`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const money=n=>'$ '+(Number(n)||0).toLocaleString('es-AR');
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';
const token=(location.pathname.match(/\/r\/([A-Za-z0-9]{24,64})/)||[])[1]||new URLSearchParams(location.search).get('t')||'';
let db=null,data=null,d=null;
const S={rating_general:0,rating_puntualidad:0,rating_trato:0,recomendaria:null,sending:false};
const ETIQUETAS=['','Muy malo','Malo','Regular','Bueno','Excelente'];

/* Mismo formato que la app (_mapRemitoRow) para que el PDF y su código de verificación coincidan. */
function mapear(r){
  const p1=r.pago_1_metodo?cap(r.pago_1_metodo):null,p2=r.pago_2_metodo?cap(r.pago_2_metodo):null;
  return{nro:r.nro_remito,fecha:fecha(r.status==='firmado'?(r.firmado_at||r.created_at_device):r.created_at_device),srvOrden:r.nro_servicio||'',nroSrv:r.nro_servicio||'',
    patente:r.patente,marca:r.marca_modelo||'',cliente:r.razon_social||'',cuit:r.cuit||'',telefono:'',origen:r.origen,destino:r.destino,
    km:String(r.km_reales||'—'),peaje:String(r.imp_peaje||0),excedente:String(r.imp_excedente||0),otros:String(r.imp_otros||0),
    tipo:r.tipo_servicio||'',tipoReal:r.tipo_servicio||'',pago:p1&&p2?`${p1}+${p2}`:(p1||'—'),
    estado:r.status==='firmado'?'firmado':r.status==='anulado'?'anulado':r.status==='cerrado_admin'?'cerrado_admin':'pendiente',
    conformidades:{servicio:r.conformidad_servicio??null,cargos:r.conformidad_cargos??null,danos:r.sin_danos??null,arrastre:r.conformidad_arrastre??null},
    foto_urls:Array.isArray(r.foto_urls)?r.foto_urls:[],acceptedTotal:r.accepted_imp_total_extras??null,firmaUrl:r.firma_imagen_url||null,
    chofer:r.chofer||'—',createdAt:r.created_at_device||null,firmadoAt:r.firmado_at||null};
}

function estado(){if(d.estado==='anulado')return['is-void','Anulado'];if(d.estado==='firmado')return['is-ok','Firmado'];return['is-pending','Pendiente']}

function render(){
  const e=data.empresa||{},[cls,label]=estado();
  document.title=`Servicio ${d.srvOrden||d.nro} · ${e.legal_name||'Remito'}`;
  const extras=(+d.peaje||0)+(+d.excedente||0)+(+d.otros||0);
  const recorrido=d.destino&&d.destino!==d.origen?`${esc(d.origen||'—')} → ${esc(d.destino)}`:esc(d.origen||'—');
  app.innerHTML=`<header class="brand"><h1>${esc(e.legal_name||'Remito digital')}</h1><p>Remito digital de tu servicio</p></header>
  <section class="card">
    <p class="eyebrow">${d.srvOrden?'Servicio N°':'Remito'}</p>
    <div class="srv"><h2>${esc(d.srvOrden||d.nro)}</h2><span class="state ${cls}">${label}</span></div>
    <p class="meta">${esc(d.fecha)}${d.tipoReal?` · ${esc(d.tipoReal)}`:''}</p>
    <dl>
      <dt>Vehículo</dt><dd>${esc([d.patente,d.marca].filter(Boolean).join(' · ')||'—')}</dd>
      <dt>Recorrido</dt><dd>${recorrido}</dd>
      <dt>Chofer</dt><dd>${esc(d.chofer)}</dd>
      ${d.pago&&d.pago!=='—'?`<dt>Medio de pago</dt><dd>${esc(d.pago.replace('+',' + '))}</dd>`:''}
    </dl>
    ${extras>0?`<div class="total"><span>Cargos cobrados</span><span>${money(extras)}</span></div>`:''}
  </section>
  <section class="card survey" id="survey"></section>
  <button class="btn secondary" id="pdf" type="button">Descargar remito (PDF)</button>
  <footer>${esc([e.legal_name,e.address,e.contact].filter(Boolean).join(' · '))}</footer>`;
  document.getElementById('pdf').addEventListener('click',descargar);
  renderEncuesta();
}

function renderEncuesta(){
  const box=document.getElementById('survey');if(!box)return;
  const pdf=document.getElementById('pdf');
  if(pdf)pdf.classList.toggle('secondary',!!data.survey_open&&!data.survey?.submitted&&!S.done);
  if(data.survey?.submitted||S.done){box.innerHTML=`<div class="thanks"><div class="big">🙌</div><h3>¡Gracias por tu opinión!</h3><p>Nos ayuda a mejorar cada servicio.</p></div>`;return}
  if(!data.survey_open){box.hidden=true;return}
  const estrellas=(k)=>`<div class="stars" role="radiogroup">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${S[k]===n}" aria-label="${n} de 5 · ${ETIQUETAS[n]}" data-k="${k}" data-v="${n}" class="${S[k]>=n?'on':''}">★</button>`).join('')}</div><div class="stars-hint">${S[k]?ETIQUETAS[S[k]]:''}</div>`;
  box.innerHTML=`<h3>¿Cómo fue tu experiencia?</h3><p>Son 30 segundos y nos ayudan mucho.</p>
    <fieldset class="q"><legend>Calificación general</legend>${estrellas('rating_general')}</fieldset>
    <fieldset class="q"><legend>Puntualidad <small>(opcional)</small></legend>${estrellas('rating_puntualidad')}</fieldset>
    <fieldset class="q"><legend>Trato del chofer <small>(opcional)</small></legend>${estrellas('rating_trato')}</fieldset>
    <fieldset class="q"><legend>¿Nos recomendarías? <small>(opcional)</small></legend><div class="yesno"><button type="button" data-rec="1" class="${S.recomendaria===true?'on':''}" aria-pressed="${S.recomendaria===true}">Sí</button><button type="button" data-rec="0" class="${S.recomendaria===false?'on':''}" aria-pressed="${S.recomendaria===false}">No</button></div></fieldset>
    <fieldset class="q"><legend>¿Algo para contarnos? <small>(opcional)</small></legend><textarea id="comentario" maxlength="1000" placeholder="Tu comentario"></textarea></fieldset>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="enviar" type="button">Enviar opinión</button>`;
  const texto=S.comentario||'';box.querySelector('#comentario').value=texto;
  box.querySelector('#comentario').addEventListener('input',e=>{S.comentario=e.target.value});
  box.querySelectorAll('.stars button').forEach(b=>b.addEventListener('click',()=>{S[b.dataset.k]=+b.dataset.v;renderEncuesta()}));
  box.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.rec==='1';S.recomendaria=S.recomendaria===v?null:v;renderEncuesta()}));
  box.querySelector('#enviar').addEventListener('click',enviar);
}

async function enviar(){
  const err=document.getElementById('err'),btn=document.getElementById('enviar');
  if(!S.rating_general){err.textContent='Elegí una calificación general (de 1 a 5 estrellas).';err.hidden=false;return}
  if(S.sending)return;S.sending=true;btn.disabled=true;btn.textContent='Enviando…';err.hidden=true;
  const payload={rating_general:S.rating_general,rating_puntualidad:S.rating_puntualidad||null,rating_trato:S.rating_trato||null,comentario:S.comentario||''};
  if(S.recomendaria!==null)payload.recomendaria=S.recomendaria;
  try{const {error}=await db.rpc('submit_remito_survey_v1',{p_token:token,p_payload:payload});if(error)throw error;S.done=true;renderEncuesta()}
  catch(e){err.textContent=e?.message||'No se pudo enviar. Probá de nuevo.';err.hidden=false;btn.disabled=false;btn.textContent='Enviar opinión'}
  finally{S.sending=false}
}

async function descargar(){
  const btn=document.getElementById('pdf');btn.disabled=true;const txt=btn.textContent;btn.textContent='Generando PDF…';
  try{
    if(!window.RemitoPdf)throw new Error('El PDF todavía se está cargando');
    window.CompanyDocuments={load:async()=>data.empresa||{},esc};
    await window.RemitoPdf.download(d);
  }catch(e){alert(e?.message||'No se pudo generar el PDF')}
  finally{btn.disabled=false;btn.textContent=txt}
}

async function init(){
  if(!token){app.innerHTML='<div class="center">Este link no es válido.</div>';return}
  try{
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const {data:res,error}=await db.rpc('get_public_remito_v1',{p_token:token});
    if(error)throw error;
    if(!res?.remito){app.innerHTML='<div class="center">Este link no existe o ya venció.</div>';return}
    data=res;d=mapear(res.remito);render();
  }catch(e){app.innerHTML=`<div class="center">No pudimos cargar el remito. Probá de nuevo en unos minutos.</div>`}
}
init();
})();
</script>
</body>
</html>
