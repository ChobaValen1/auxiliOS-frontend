name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax and security checks
        run: npm run check
      - name: Frontend tests
        shell: bash
        run: |
          set +e
          failed=0
          for test_file in test/*.test.js; do
            echo "::group::$test_file"
            if ! node --test "$test_file"; then
              echo "::error file=$test_file::Test file failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - run: npm audit --omit=dev --audit-level=high
