      origin_place_id:'qa-o',destination_place_id:'qa-d',origin_formatted_address:'Av. Corrientes 1234, Buenos Aires',destination_formatted_address:'Av. Maipú 2450, Olivos',

  if(name==='list_toll_catalog')return {data:[],error:null};
  if(name==='check_recent_provider_code_v3')return {data:{duplicate:false},error:null};
  return {data:null,error:{message:'QA: guardado deshabilitado; esta pantalla no se conecta a datos reales.'}};
},functions:{invoke:async()=>({data:{distanceMeters:28000,durationSeconds:2100,provider:'google_routes'},error:null})}};
